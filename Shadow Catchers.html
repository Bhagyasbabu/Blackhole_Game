<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shadow Catchers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one column "observing log". Each mission is a sheet with a short briefing beside a live instrument screen.
   Colour comes from the EHT brightness-temperature scale: instrument screens stay dark in both themes, the page around them follows the viewer. */
:root{
  --bg:#e9ecf1; --surface:#ffffff; --fg:#17131b; --muted:#5a5462; --line:#cdd1da;
  --accent:#b23d0b; --accent-fg:#ffffff; --ok:#17744a; --bad:#b42318;
  --screen:#0b0709; --screen-line:#2b2023; --screen-fg:#f4e9e1;
  --e0:#5a0f08; --e1:#b3260e; --e2:#ef6a1a; --e3:#ffb347; --e4:#ffe9b0;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140d11; --surface:#1e1519; --fg:#f6ece6; --muted:#b6a7a3; --line:#3b2c31;
  --accent:#ff8a3d; --accent-fg:#1a0d06; --ok:#5fd39a; --bad:#ff7b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140d11; --surface:#1e1519; --fg:#f6ece6; --muted:#b6a7a3; --line:#3b2c31;
  --accent:#ff8a3d; --accent-fg:#1a0d06; --ok:#5fd39a; --bad:#ff7b6b; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);
  padding-block:14px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:700}
h2{font-size:clamp(1.6rem,4.6vw,2.2rem);font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0 0 .8em;max-width:62ch}
a{color:var(--accent)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font:700 1.05rem/1 var(--font-display);display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);padding:0;cursor:pointer}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#000 0 38%,var(--e1) 46%,var(--e2) 62%,var(--e3) 72%,transparent 76%);display:inline-block}
.pips{display:flex;flex-wrap:wrap;gap:6px}
.pip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;border-radius:6px;font:12px/1 var(--font-mono);cursor:pointer}
.pip b{width:9px;height:9px;border-radius:2px;display:inline-block}
.pip[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pip:disabled{opacity:.45;cursor:not-allowed}
.pip .st{color:var(--accent)}

.sheet{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px 36px;align-items:start}
@media (max-width:820px){.sheet{grid-template-columns:minmax(0,1fr)}}
.brief h2{margin-bottom:14px}
.brief .tip{font-size:.92rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.inst{display:flex;flex-direction:column;gap:14px;min-width:0}
.screen{background:var(--screen);border:1px solid var(--screen-line);border-radius:8px;overflow:hidden;color:var(--screen-fg)}
canvas{display:block;width:100%}
.ctrl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ctrl label,.lab{font-weight:600;font-size:.95rem}
.ctrl label .u{font-weight:400;color:var(--muted);font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.row>output{min-width:5.5em}
input[type=range]{flex:1 1 180px;min-width:0;accent-color:var(--accent);height:28px}
.btn{font:600 .95rem/1 var(--font-body);background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:12px 18px;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:.92rem;color:var(--muted);flex:1 1 200px;min-width:0}
.msg b{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px/1 var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface)}
.chip.c{border-color:var(--e1)}.chip.e{border-color:var(--e3)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.read div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.read small{display:block;color:var(--muted);font-size:.78rem;margin-bottom:4px}
.read strong{font:500 1.15rem/1.1 var(--font-mono)}

.debrief{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:10px}
.debrief .stars{color:var(--accent);letter-spacing:.1em;margin-left:8px}
.debrief ul{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:68ch}
.debrief .src{font-size:.85rem;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grid2 .screen small{display:block;padding:6px 10px;font:11px var(--font-mono);color:#b9a8a1;border-top:1px solid var(--screen-line)}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.site{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--fg);cursor:pointer;display:grid;gap:2px;font:inherit;min-height:44px}
.site b{font-size:.92rem}.site small{color:var(--muted);font-size:.78rem}
.site[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.site[aria-pressed="true"] b::before{content:"● ";color:var(--accent)}
.meter{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--e1),var(--e2),var(--e3));width:0;transition:width .25s}
.meter u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);text-decoration:none}

.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.pairs{grid-template-columns:minmax(0,1fr)}}
.pcol{display:grid;gap:8px;align-content:start}
.pc{text-align:left;font:inherit;font-size:.9rem;line-height:1.35;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;min-height:44px}
.pc small{display:block;color:var(--muted);font-size:.74rem;margin-top:4px;font-family:var(--font-mono)}
.pc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));cursor:default}
.pc.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.pc.no{animation:none;border-color:var(--bad)}.meter i{transition:none}}
.quiz{display:grid;gap:8px}
.q{display:grid;gap:4px;text-align:left}
.q.right{border-color:var(--ok)}.q.wrong{border-color:var(--bad)}
.q em{font-style:normal;font-size:.82rem;color:var(--muted)}

.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px 40px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.hero .screen{order:-1;max-width:380px}}
.hero h1{margin-bottom:16px}
.hero ol{padding-left:1.2em;margin:0 0 20px;display:grid;gap:4px}
.final{display:grid;gap:14px}
.final table{border-collapse:collapse;width:100%;max-width:640px;font-size:.95rem}
.final td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.final td:last-child{text-align:right;white-space:nowrap;color:var(--accent)}
footer{margin-top:40px;font-size:.82rem;color:var(--muted);max-width:70ch}
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="home" aria-label="Back to start"><i></i>Shadow Catchers</button>
    <nav class="pips" id="pips" aria-label="Missions"></nav>
  </header>
  <main id="stage"></main>
  <footer>Built from the Event Horizon Telescope Collaboration paper "First Sagittarius A* Event Horizon Telescope Results. I." (ApJL 930:L12, 2022; <a href="https://doi.org/10.3847/2041-8213/ac6674" target="_blank" rel="noopener">doi:10.3847/2041-8213/ac6674</a>). The games are simplified for play. Numbers come from the paper unless a note says they are examples.</footer>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var DPR=Math.min(window.devicePixelRatio||1,2);
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var COL={bg:'#0b0709',line:'#2b2023',fg:'#f4e9e1',dim:'#9d8c86',ember:'#ef6a1a',red:'#ff5a3c',gold:'#ffd98a',hot:'#ffb347'};
var S={lv:-1,stars:[0,0,0,0,0],done:[false,false,false,false,false]};
var stage=$('#stage'),raf=0,cleanup=null,onResize=null;
var NAMES=['Bend','Weigh','Build','Verdict','Use'];
var PIPC=['#5a0f08','#b3260e','#ef6a1a','#ffb347','#ffe9b0'];

function fit(c,aspect){var w=c.parentElement.clientWidth||c.clientWidth||320,h=Math.round(w*aspect);c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);c.style.height=h+'px';var g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return{g:g,w:w,h:h}}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function seeded(seed){return function(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function bgStars(n,seed){var r=seeded(seed),a=[];for(var i=0;i<n;i++)a.push([r(),r(),.15+r()*.5]);return a}
function drawBgStars(g,w,h,a){for(var i=0;i<a.length;i++){g.fillStyle='rgba(244,233,225,'+a[i][2]+')';g.fillRect(a[i][0]*w,a[i][1]*h,1.2,1.2)}}

/* ember colour map, same family as the EHT images */
var STOPS=[[0,8,4,6],[.22,96,16,10],[.5,222,80,14],[.78,255,170,60],[1,255,242,205]],LUT=[];
(function(){for(var i=0;i<256;i++){var t=i/255,k=0;while(k<STOPS.length-2&&t>STOPS[k+1][0])k++;var a=STOPS[k],b=STOPS[k+1],f=(t-a[0])/(b[0]-a[0]);LUT.push([a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f,a[3]+(b[3]-a[3])*f])}})();
function paintField(N,field,canvas){var off=document.createElement('canvas');off.width=off.height=N;var og=off.getContext('2d'),id=og.createImageData(N,N);
  for(var i=0;i<N*N;i++){var v=Math.max(0,Math.min(1,field[i])),c=LUT[Math.round(v*255)];id.data[i*4]=c[0];id.data[i*4+1]=c[1];id.data[i*4+2]=c[2];id.data[i*4+3]=255}
  og.putImageData(id,0,0);var g=canvas.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(off,0,0,canvas.width/DPR,canvas.height/DPR)}
function angd(a,b){var d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function ringField(N,span,o){var f=new Float32Array(N*N),R=o.d/2,norm=1+o.A+(o.spot||0);
  for(var j=0;j<N;j++)for(var i=0;i<N;i++){var x=((i+.5)/N-.5)*2*span,y=((j+.5)/N-.5)*2*span,r=Math.hypot(x,y),th=Math.atan2(y,x);
    var prof=Math.exp(-Math.pow((r-R)/o.sig,2)/2),asym=1+o.A*Math.cos(th-o.th0);
    var spot=o.spot?o.spot*Math.exp(-Math.pow(angd(th,o.ths)/.5,2)/2)*Math.exp(-Math.pow((r-R)/(o.sig*1.2),2)/2):0;
    var fl=o.floor*Math.exp(-Math.pow(r/(R*1.6),2));f[j*N+i]=(prof*asym+spot+fl)/norm}
  return f}

/* ---------- chrome ---------- */
function pips(){var el=$('#pips');el.innerHTML='';for(var i=0;i<5;i++){(function(i){var b=document.createElement('button');b.className='pip';
  var open=i===0||S.done[i-1]||S.done[i];b.disabled=!open;if(S.lv===i)b.setAttribute('aria-current','true');
  b.innerHTML='<b style="background:'+PIPC[i]+'"></b>'+(i+1)+' '+NAMES[i]+(S.done[i]?' <span class="st">'+starStr(S.stars[i])+'</span>':'');
  b.onclick=function(){go(i)};el.appendChild(b)})(i)}}
function sheet(n,title,brief,inst){return '<section class="sheet"><div class="brief"><p class="eyebrow">Mission '+(n+1)+' of 5</p><h2>'+title+'</h2>'+brief+'</div><div class="inst">'+inst+'</div></section><div id="debrief" class="debrief" hidden></div>'}
function finish(i,stars,html){S.done[i]=true;S.stars[i]=Math.max(S.stars[i],stars);pips();var d=$('#debrief');d.hidden=false;
  d.innerHTML='<h3>Mission complete<span class="stars" aria-label="'+stars+' of 3 stars">'+starStr(stars)+'</span></h3>'+html+'<div class="actions"><button class="btn" id="next">'+(i<4?'Next mission':'See your results')+'</button></div>';
  $('#next').onclick=function(){go(i+1)};try{d.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})}catch(e){}}
function go(n){if(cleanup){cleanup();cleanup=null}cancelAnimationFrame(raf);onResize=null;S.lv=n;pips();window.scrollTo(0,0);
  [L1,L2,L3,L4,L5,Final][n]?[L1,L2,L3,L4,L5,Final][n]():Intro()}
$('#home').onclick=function(){if(cleanup){cleanup();cleanup=null}cancelAnimationFrame(raf);onResize=null;S.lv=-1;pips();Intro()};
window.addEventListener('resize',function(){if(onResize)onResize()});

/* ---------- intro ---------- */
function Intro(){
  stage.innerHTML='<section class="hero"><div><p class="eyebrow">Based on the 2022 Sgr A* results</p><h1>Shadow Catchers</h1>'+
  '<p>In the middle of our galaxy sits a black hole with the mass of four million Suns. In 2022 a network of radio telescopes spread across the Earth gave us its first picture. Play through five short missions to see how that picture was made, and why it matters.</p>'+
  '<ol><li>Bend light around a black hole and find the edge of its shadow.</li><li>Weigh the monster using orbiting stars.</li><li>Build a telescope as wide as the Earth.</li><li>Decide what the image says about the object at the centre.</li><li>Match the technology to what it does for everyday life.</li></ol>'+
  '<div class="actions"><button class="btn" id="start">Start mission 1</button></div><p class="src" style="margin-top:10px;font-size:.85rem;color:var(--muted)">About 10 minutes. Works with touch or mouse.</p></div>'+
  '<div class="screen"><canvas id="hero"></canvas></div></section>';
  $('#start').onclick=function(){go(0)};
  var c=$('#hero'),t0=0,N=120,frame=0;
  function draw(){var f=fit(c,1);f.g.fillStyle=COL.bg;f.g.fillRect(0,0,f.w,f.h);
    var th=reduce?0.9:t0;paintField(N,ringField(N,80,{d:51.8,sig:7.5,A:.35,th0:-1.9,spot:.9,ths:th,floor:.05}),c)}
  function loop(){t0+=.012;if(!reduce&&(frame++%2===0))draw();raf=requestAnimationFrame(loop)}
  draw();onResize=draw;if(!reduce)raf=requestAnimationFrame(loop)}

/* ---------- mission 1: bend the light ---------- */
function L1(){
  var BC=1.5*Math.sqrt(3);
  stage.innerHTML=sheet(0,'Find the edge of the shadow',
   '<p>A black hole is a place where gravity is so strong that nothing, not even light, can leave. Light that passes close is bent. Light that gets too close falls in. The dark patch we see against the glowing gas is the <b>shadow</b>.</p>'+
   '<p>Send light rays past the black hole. Each ray travels from the left, offset from the centre by <b>b</b>. Find the boundary between a ray that is captured and a ray that escapes, and narrow the gap to 0.12 Rs or less.</p>'+
   '<p class="tip">Rs is the Schwarzschild radius, 2GM/c², the size of the event horizon. Fewer shots earn more stars.</p>',
   '<div class="screen"><canvas id="c1"></canvas></div>'+
   '<div class="ctrl"><label for="b">Aim offset b <span class="u">in Rs</span></label><div class="row"><input id="b" type="range" min="0.5" max="4.8" step="0.01" value="4"><output id="bv" class="mono" for="b">4.00 Rs</output></div>'+
   '<div class="row"><button class="btn" id="fire">Fire ray</button><span class="msg" id="msg" role="status">Start with a wide offset and move inward.</span></div></div>'+
   '<div class="chips" id="log" aria-label="Shots fired"></div>');
  var c=$('#c1'),sl=$('#b'),bv=$('#bv'),fireB=$('#fire'),msg=$('#msg'),log=$('#log');
  var bgs=bgStars(90,7),shots=[],anim=null,solved=false;
  function trace(b){var R0=16,u0=1/R0,h=0.012,phi=Math.asin(b*u0),u=u0,w=Math.cos(phi)/b,pts=[[-Math.cos(phi)*R0,Math.sin(phi)*R0]],cap=false,i=0;
    function f(u,w){return[w,-u+1.5*u*u]}
    for(;i<9000;i++){var k1=f(u,w),k2=f(u+h/2*k1[0],w+h/2*k1[1]),k3=f(u+h/2*k2[0],w+h/2*k2[1]),k4=f(u+h*k3[0],w+h*k3[1]);
      u+=h/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);w+=h/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);phi+=h;
      if(u>=1){cap=true;break}
      if(i%3===0){var r=1/u;pts.push([-r*Math.cos(phi),r*Math.sin(phi)])}
      if(w<0&&u<=u0)break}
    if(i>=9000)cap=b<BC;
    var r2=1/Math.min(u,1);pts.push([-r2*Math.cos(phi),r2*Math.sin(phi)]);
    return{b:b,pts:pts,cap:cap,defl:(phi-Math.PI)*180/Math.PI}}
  function draw(){var f=fit(c,.62),g=f.g,w=f.w,h=f.h,sc=w/16,cx=w/2,cy=h/2;
    g.fillStyle=COL.bg;g.fillRect(0,0,w,h);drawBgStars(g,w,h,bgs);
    g.setLineDash([3,4]);g.strokeStyle='rgba(255,179,71,.45)';g.lineWidth=1;g.beginPath();g.arc(cx,cy,1.5*sc,0,7);g.stroke();g.setLineDash([]);
    var gr=g.createRadialGradient(cx,cy,sc*.9,cx,cy,sc*1.6);gr.addColorStop(0,'rgba(239,106,26,.55)');gr.addColorStop(1,'rgba(239,106,26,0)');g.fillStyle=gr;g.beginPath();g.arc(cx,cy,sc*1.6,0,7);g.fill();
    g.fillStyle='#000';g.beginPath();g.arc(cx,cy,sc,0,7);g.fill();
    if(solved){g.setLineDash([6,5]);g.strokeStyle=COL.ember;g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,BC*sc,0,7);g.stroke();g.setLineDash([]);
      g.fillStyle=COL.hot;g.font='11px IBM Plex Mono,monospace';g.textAlign='center';g.fillText('shadow edge, b = 2.6 Rs',cx,cy+BC*sc+16)}
    var b=parseFloat(sl.value);if(!anim){g.setLineDash([2,5]);g.strokeStyle='rgba(244,233,225,.5)';g.lineWidth=1;g.beginPath();g.moveTo(0,cy-b*sc);g.lineTo(cx,cy-b*sc);g.stroke();g.setLineDash([]);

   '<div class="ctrl" id="quizbox" hidden><div class="lab">Verdict: which of these does the image rule out?</div><p class="msg" style="max-width:none">Stellar orbits gave 3.95 and 4.30 million Suns, so two very different methods agree. Select every idea the paper says the image excludes, then submit.</p><div class="quiz" id="quiz"></div><div class="row"><button class="btn" id="sub">Submit verdict</button><span class="msg" id="qm" role="status"></span></div></div>');
  var c=$('#c4'),sl=$('#mm'),mv=$('#mmv'),pd=$('#pd'),msg=$('#msg');
  function pred(){return DPM*parseFloat(sl.value)}
  function draw(){var f=fit(c,.72),g=f.g,w=f.w,h=f.h,sc=w/160,cx=w/2,cy=h/2;g.fillStyle=COL.bg;g.fillRect(0,0,w,h);
    var N=100,fld=ringField(N,80,{d:51.8,sig:7.5,A:.3,th0:-1.9,spot:.5,ths:2.2,floor:.05}),off=document.createElement('canvas');off.width=off.height=N;var og=off.getContext('2d'),id=og.createImageData(N,N);
    for(var i=0;i<N*N;i++){var v=Math.max(0,Math.min(1,fld[i])),col=LUT[Math.round(v*255)];id.data[i*4]=col[0];id.data[i*4+1]=col[1];id.data[i*4+2]=col[2];id.data[i*4+3]=255}
    og.putImageData(id,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';var side=160*sc;g.drawImage(off,cx-side/2,cy-side/2,side,side);
    var d=pred(),r=d/2*sc;g.setLineDash([7,5]);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();g.setLineDash([]);
    g.strokeStyle='rgba(255,255,255,.85)';g.beginPath();g.moveTo(cx-r,cy);g.lineTo(cx+r,cy);g.stroke();g.fillStyle='#fff';g.font='11px IBM Plex Mono,monospace';g.textAlign='center';g.fillText(d.toFixed(1)+' µas',cx,cy-8);
    g.textAlign='left';g.fillStyle=COL.dim;g.fillText('measured ring: 51.8 µas',10,h-10);g.textAlign='right';g.fillText('dashed: predicted shadow',w-10,h-10);}
  function upd(){mv.textContent=parseFloat(sl.value).toFixed(2);pd.textContent=pred().toFixed(1)+' µas';draw()}
  sl.oninput=upd;
  $('#cmp').onclick=function(){attempts++;var d=pred();if(d>=41.7&&d<=55.7){solved=true;msg.innerHTML='<b>It fits.</b> A mass of '+parseFloat(sl.value).toFixed(2)+' million Suns gives a shadow inside the measured range.';$('#quizbox').hidden=false;$('#cmp').disabled=true;sl.disabled=true;try{$('#quizbox').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})}catch(e){}}
    else msg.innerHTML='<b>Not yet.</b> The predicted shadow is '+(d<41.7?'too small. Try a heavier mass.':'too large. Try a lighter mass.')};
  var Q=[{id:'a',t:'A traversable wormhole (Morris–Thorne)',x:true,e:'Ruled out. It predicts a shadow much smaller than a black hole’s.'},
   {id:'b',t:'A naked singularity (Reissner–Nordström)',x:true,e:'Ruled out. It also predicts a much smaller shadow.'},
   {id:'c',t:'A hard surface that re-radiates falling gas',x:true,e:'Ruled out. It would glow in infrared far brighter than Sgr A* does.'},
   {id:'d',t:'Every possible horizonless black hole mimicker',x:false,e:'Not ruled out. Some mimickers produce shadows consistent with the image.'},
   {id:'e',t:'A spinning (Kerr) black hole',x:false,e:'Not ruled out. The images match its expected appearance.'}];
  var qb=$('#quiz'),sel={};Q.forEach(function(q){var b=document.createElement('button');b.className='pc q';b.setAttribute('aria-pressed','false');b.innerHTML='<span>'+q.t+'</span><em hidden></em>';
    b.onclick=function(){if(b.dataset.lock)return;sel[q.id]=!sel[q.id];b.setAttribute('aria-pressed',sel[q.id]?'true':'false')};q.el=b;qb.appendChild(b)});
  $('#sub').onclick=function(){if($('#sub').disabled)return;var errs=0;Q.forEach(function(q){var picked=!!sel[q.id],right=picked===q.x;if(!right)errs++;q.el.dataset.lock='1';q.el.classList.add(right?'right':'wrong');var em=q.el.querySelector('em');em.hidden=false;em.textContent=(right?'Correct. ':'Check this one. ')+q.e});
    $('#sub').disabled=true;var st=errs===0?3:errs===1?2:1;$('#qm').textContent=errs===0?'All correct.':errs+' to check.';
    finish(3,st,'<ul><li>The ring is 51.8 ± 2.3 µas across, with a dim interior. Its size matches the mass from stellar orbits, with no tuning.</li>'+
    '<li>The paper says the data disfavour a black hole seen nearly edge-on (inclination above 50°), a non-spinning black hole, and gas orbiting against the spin.</li>'+
    '<li>Sgr A* is about 1,500 times lighter than M87*, yet both images fit the same prediction. General relativity holds over three orders of magnitude in mass.</li></ul><p class="src">From the paper, Sections 6 and 7 and the abstract. The paper says the dark centre supports an event horizon, while some horizonless mimickers remain possible.</p>')};
  upd();onResize=draw}

/* ---------- mission 5: use ---------- */
function L5(){
  var T=[{id:'maser',t:'Hydrogen-maser clocks keeping every telescope in step'},{id:'vlbi',t:'Telescopes linked across the whole Earth (VLBI)'},{id:'img',t:'Rebuilding a picture from sparse, noisy measurements'},{id:'data',t:'Recording 32 GB every second at each telescope'},{id:'sim',t:'Supercomputer simulations of hot, magnetised gas'}];
  var U=[{id:'sim',t:'Plasma research for fusion energy and space-weather forecasts'},{id:'maser',t:'Precise timing for navigation, telecom and power networks'},{id:'data',t:'Handling huge datasets in science, medicine and industry'},{id:'vlbi',t:'Tracking Earth’s spin and drifting continents, which keeps satellite navigation accurate'},{id:'img',t:'Sharper medical, radar and seismic images from limited data'}];
  stage.innerHTML=sheet(4,'Why it matters at home',
   '<p>Nobody needs a black hole photo to get to work. But building the Earth-sized telescope took tools that reach well beyond astronomy.</p>'+
   '<p>Tap a technology on the left, then tap what it helps with on the right. Five matches complete the mission.</p>'+
   '<p class="tip">The technologies on the left appear in the paper. The everyday uses on the right are general knowledge, not claims made by the paper.</p>',
   '<div class="pairs"><div class="pcol" id="tl"></div><div class="pcol" id="ul"></div></div><div class="ctrl"><div class="row"><span class="msg" id="msg" role="status">Choose a technology first.</span></div></div>');
  var cur=null,mist=0,got=0;
  function mk(list,host,side){list.forEach(function(it){var b=document.createElement('button');b.className='pc';b.setAttribute('aria-pressed','false');b.textContent=it.t;b.dataset.id=it.id;
    b.onclick=function(){if(b.classList.contains('ok'))return;
      if(side==='t'){cur&&cur.setAttribute('aria-pressed','false');cur=b;b.setAttribute('aria-pressed','true');$('#msg').textContent='Now choose what it helps with.';return}
      if(!cur){$('#msg').textContent='Choose a technology on the left first.';return}
      if(cur.dataset.id===b.dataset.id){cur.classList.add('ok');b.classList.add('ok');cur.setAttribute('aria-pressed','false');cur=null;got++;$('#msg').innerHTML='<b>Match.</b> '+got+' of 5.';
        if(got===5){var st=mist<=1?3:mist<=3?2:1;finish(4,st,'<ul><li><b>Time:</b> hydrogen masers keep clocks steady enough to line up recordings from different continents.</li><li><b>Earth:</b> the same long-baseline method measures how our planet turns and how continents drift.</li>'+
          '<li><b>Pictures:</b> recovering an image from incomplete data is a problem shared with medical scanners and radar.</li><li><b>Data and simulation:</b> moving huge recordings and simulating magnetised plasma are skills used well outside astronomy.</li>'+
          '<li><b>Fundamental physics:</b> the image checks Einstein’s general relativity near a black hole, in a place no lab can reach.</li></ul><p class="src">Mistakes: '+mist+'. The technologies are from the paper (32 GB per second recording, hydrogen masers, imaging methods, GRMHD simulations). The uses are examples from general knowledge.</p>')}}
      else{mist++;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');$('#msg').textContent='Not that one. Try another use.'}};
    host.appendChild(b)})}
  mk(T,$('#tl'),'t');mk(U,$('#ul'),'u')}

/* ---------- final ---------- */
function Final(){
  var tot=S.stars.reduce(function(a,b){return a+b},0),facts=['Shadow edge at about 2.6 Rs','About 4 million Suns','24 µas resolution, 8 telescopes','Ring of 51.8 µas, a Kerr black hole fits','Tools that reach beyond astronomy'];
  var rows='';for(var i=0;i<5;i++)rows+='<tr><td>'+(i+1)+'. '+NAMES[i]+'</td><td>'+facts[i]+'</td><td>'+starStr(S.stars[i])+'</td></tr>';
  stage.innerHTML='<section class="final"><p class="eyebrow">Results</p><h2>You caught the shadow</h2><p>You scored '+tot+' of 15 stars. A black hole four million times the mass of the Sun sits at the heart of our galaxy. We now have a picture of it, and it matches what Einstein’s theory predicts.</p>'+
  '<div style="overflow-x:auto"><table>'+rows+'</table></div><div class="actions"><button class="btn" id="again">Play again</button><a class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center" href="https://doi.org/10.3847/2041-8213/ac6674" target="_blank" rel="noopener">Read the paper</a></div></section>';
